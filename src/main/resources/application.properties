# ═══════════════════════════════════════════════════════════════
# ViVi Backend — Application Configuration
# ═══════════════════════════════════════════════════════════════

# ─── MongoDB ───────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true

# ─── Redis (for presence tracking / pub-sub scaling) ──────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.username=${REDIS_USERNAME:default}

# ─── CORS ──────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─── JWT Authentication ───────────────────────────────────────
# Secret key for signing JWT tokens (min 32 chars for HMAC-SHA256)
app.jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production-min-32-chars}
# Token expiration: 24 hours in milliseconds
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── Google OAuth2 ─────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Where to redirect after successful Google OAuth2 login (frontend URL)
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}

# ─── Rate Limiting ─────────────────────────────────────────────
# Per-IP rate limit for unauthenticated requests
app.rate-limit.requests-per-minute=${RATE_LIMIT_ANONYMOUS:60}
# Per-user rate limit for authenticated requests
app.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTHENTICATED:100}

# ─── AI Moderation (OpenAI) ───────────────────────────────────
app.moderation.enabled=${MODERATION_ENABLED:false}
app.moderation.api-key=${OPENAI_API_KEY:}
app.moderation.api-url=${MODERATION_API_URL:https://api.openai.com/v1/moderations}

# ─── AI Summarization (Groq API) ──────────────────────────────
app.summarization.enabled=${SUMMARIZATION_ENABLED:true}
app.summarization.api-key=${OPENAI_API_KEY:}
app.summarization.api-url=${SUMMARIZATION_API_URL:https://openrouter.ai/api/v1/chat/completions}
app.summarization.model=${SUMMARIZATION_MODEL}

